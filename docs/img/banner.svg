<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PTT7 — Semáforo com travessia de pedestres baseado em FSM no ESP32, com verificação em duas camadas" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <!-- grade sutil -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M240 0V360M480 0V360M720 0V360M960 0V360"/>
  </g>

  <!-- Semáforo de veículos (verde aceso) -->
  <rect x="98" y="62" width="10" height="250" fill="#334155"/>
  <rect x="62" y="58" width="82" height="214" rx="16" fill="#020617" stroke="#475569" stroke-width="2"/>
  <circle cx="103" cy="101" r="25" fill="#7f1d1d" opacity="0.45"/>
  <circle cx="103" cy="165" r="25" fill="#78350f" opacity="0.45"/>
  <circle cx="103" cy="229" r="25" fill="#22c55e" filter="url(#glow)"/>

  <!-- Semáforo de pedestres (vermelho aceso) -->
  <rect x="190" y="148" width="8" height="164" fill="#334155"/>
  <rect x="162" y="118" width="64" height="138" rx="12" fill="#020617" stroke="#475569" stroke-width="2"/>
  <g filter="url(#glow)">
    <!-- mão (pare) -->
    <circle cx="194" cy="154" r="22" fill="#ef4444"/>
  </g>
  <rect x="186" y="143" width="16" height="20" rx="4" fill="#fee2e2" opacity="0.85"/>
  <circle cx="194" cy="220" r="22" fill="#14532d" opacity="0.5"/>
  <!-- boneco andando (apagado) -->
  <g fill="#86efac" opacity="0.35">
    <circle cx="196" cy="207" r="4"/>
    <path d="M193 212h6l3 10-3 1-2-6-1 8 4 9-3 1-4-8-3 8-3-1 3-10 1-7-3 4-2-2z"/>
  </g>
  <rect x="40" y="310" width="210" height="6" rx="3" fill="#334155"/>

  <!-- Títulos -->
  <text x="290" y="96" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700">PTT7 · Semáforo FSM no ESP32</text>
  <text x="292" y="130" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Travessia de pedestres com verificação em duas camadas: Z3 (modelo) + ESBMC (código)</text>

  <!-- Ciclo principal da FSM -->
  <g font-family="Consolas, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="292" y="186" width="74" height="40" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="329" y="211" fill="#cbd5e1">INIT</text>

    <rect x="392" y="186" width="96" height="40" rx="10" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
    <text x="440" y="211" fill="#86efac">VERDE V</text>

    <rect x="514" y="186" width="96" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="562" y="211" fill="#7dd3fc">PEDIDO</text>

    <rect x="636" y="186" width="110" height="40" rx="10" fill="#422006" stroke="#f59e0b" stroke-width="2"/>
    <text x="691" y="211" fill="#fcd34d">ATENÇÃO V</text>

    <rect x="772" y="186" width="160" height="40" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="852" y="211" fill="#fca5a5">VERMELHO V · VERDE P</text>

    <rect x="958" y="186" width="110" height="40" rx="10" fill="#422006" stroke="#f59e0b" stroke-width="2"/>
    <text x="1013" y="211" fill="#fcd34d">ATENÇÃO P</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M366 206H388"/>
    <path d="M488 206H510"/>
    <path d="M610 206H632"/>
    <path d="M746 206H768"/>
    <path d="M932 206H954"/>
    <!-- retorno ATENÇÃO P → VERDE V -->
    <path d="M1013 226 V258 H440 V230"/>
    <!-- atalho VERDE V → ATENÇÃO V (T4) -->
    <path d="M440 186 V166 H691 V182" stroke-dasharray="5 4"/>
  </g>
  <text x="565" y="160" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">T4: verde mínimo já cumprido</text>

  <!-- Falha / recuperação -->
  <g font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700">
    <rect x="1088" y="166" width="88" height="34" rx="9" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
    <text x="1132" y="188" fill="#e9d5ff" text-anchor="middle">FALHA</text>
    <rect x="1088" y="214" width="88" height="34" rx="9" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <text x="1132" y="236" fill="#c7d2fe" text-anchor="middle">RECOVERY</text>
  </g>
  <path d="M1132 200V210" stroke="#a855f7" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Rodapé -->
  <text x="292" y="300" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">8 estados · 16 transições (T1–T16) · propriedades P1–P6 verificadas · ESP-IDF + FreeRTOS</text>
  <text x="292" y="326" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Qualquer estado operacional → FALHA → RECOVERY → VERDE V   ·   PPCA/UFRR · 2026.2</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
